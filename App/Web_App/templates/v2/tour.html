<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2a2a2a">
    <title>Ride - PassingBy</title>
    <link rel="stylesheet" href="/static/v2/css/style.css?v=7">
    <link rel="stylesheet" href="/static/v2/css/v2.css?v=9">
</head>
<body class="v2-ride-body">
    <!-- v2 ride. Figma: "04d · In-ride map — Final direction, postcard version".
         Spec: docs/design/handoff-in-ride-map.md -->
    <div class="screen v2-ride">
        <div id="tour-map" class="v2-ride-map"></div>

        <!-- Top: next stop panel (with theme badge) and controls -->
        <div class="v2-ride-top">
            <div class="v2-next" id="next-panel">
                <span class="v2-badge" id="theme-badge" aria-hidden="true"></span>
                <span class="v2-next-text">
                    <span class="v2-eyebrow" id="next-eyebrow">Next stop</span>
                    <span class="v2-next-name" id="next-stop-name">Planning your route…</span>
                </span>
                <span class="v2-next-eta" id="journey-eta"></span>
            </div>
            <div class="v2-ride-controls">
                <button type="button" class="v2-audio" id="audio-toggle" aria-pressed="false">
                    <span>Audio</span>
                    <span class="v2-switch" aria-hidden="true"><i></i></span>
                </button>
                <button type="button" class="v2-end" id="end-tour" aria-label="End the ride">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <!-- Landmark audio is switched off in this preview; the toggle shows this instead -->
            <div class="v2-soon" id="audio-soon" role="status" aria-live="polite" hidden>
                <strong>Audio is coming soon</strong>
                <span>For now, tap a card to read its story.</span>
            </div>
        </div>

        <div class="v2-pin-hint" id="pin-hint" hidden>Tap a landmark to open its card</div>

        <!-- State 1: minimised card -->
        <div class="v2-mini" id="mini-card" hidden>
            <span class="v2-handle" aria-hidden="true"></span>
            <div class="v2-mini-photo"><img id="mini-img" alt=""></div>
            <div class="v2-mini-text">
                <span class="v2-eyebrow" id="mini-eyebrow"></span>
                <span class="v2-mini-name" id="mini-name"></span>
                <span class="v2-live" id="mini-live">
                    <svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>
                    Stories are playing live
                </span>
            </div>
        </div>
        <p class="v2-swipe-hint" id="swipe-hint" hidden>↑ Swipe up on the card to open the postcard</p>

        <!-- States 2 and 3: postcard deck (tap to flip, swipe down to minimise, swipe sideways for the next one) -->
        <div class="v2-deck" id="deck" hidden>
            <div class="v2-deck-card v2-deck-card--3" aria-hidden="true"></div>
            <div class="v2-deck-card v2-deck-card--2" aria-hidden="true"></div>
            <div class="v2-pc" id="postcard" role="button" aria-label="Postcard. Tap to flip.">
                <div class="v2-pc-inner">
                    <div class="v2-pc-face v2-pc-front">
                        <span class="v2-handle" aria-hidden="true"></span>
                        <div class="v2-pc-mount"><div class="v2-pc-photo"><img id="pc-img" alt=""></div></div>
                        <span class="v2-eyebrow v2-pc-where" id="pc-where"></span>
                        <p class="v2-pc-name" id="pc-name"></p>
                        <span class="v2-pc-pill">Tap to read the story</span>
                    </div>
                    <div class="v2-pc-face v2-pc-back">
                        <span class="v2-handle" aria-hidden="true"></span>
                        <div class="v2-pc-stamp"><img id="pc-stamp" alt=""></div>
                        <span class="v2-eyebrow" id="pc-back-eyebrow"></span>
                        <p class="v2-pc-name v2-pc-name--back" id="pc-back-name"></p>
                        <div class="v2-pc-story" id="pc-story"></div>
                        <span class="v2-pc-pill">Tap to flip back</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>const GOOGLE_MAPS_KEY = "{{ google_maps_key }}";</script>
    <script src="/static/v2/js/editions.js?v=1"></script>
    <script src="/static/v2/js/map_pins.js?v=1"></script>
    <script src="/static/v2/js/tour_logic.js?v=23"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_key }}&libraries=geometry&callback=initMap" async defer></script>
</body>
</html>
