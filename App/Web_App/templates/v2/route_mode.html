<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Choose Route - PassingBy</title>
    <link rel="stylesheet" href="/static/v2/css/style.css?v=7">
    <link rel="stylesheet" href="/static/v2/css/v2.css?v=4">
</head>
<body>
    <!-- v2 Choose Route. Figma: "02c · Choose Route — Final direction".
         Both routes on one map, the time difference, and the landmarks the PassingBy route passes. -->
    <div class="screen v2-route">
        <header class="v2-header">
            <button class="v2-back" onclick="history.back()" aria-label="Go back">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 19L8 12L15 5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <h1>Choose Route</h1>
        </header>

        <div class="v2-route-map" id="route-map">
            <div class="v2-route-map-loading" id="map-loading">Planning your routes…</div>
        </div>

        <div class="v2-route-options">
            <button type="button" class="v2-option" id="opt-fastest" data-mode="fastest" aria-pressed="false">
                <span class="v2-radio" aria-hidden="true"></span>
                <span class="v2-line v2-line--fastest" aria-hidden="true"></span>
                <span class="v2-option-name">Fastest</span>
                <span class="v2-option-time" id="time-fastest">–</span>
            </button>

            <button type="button" class="v2-option v2-option--passingby is-selected" id="opt-scenic" data-mode="scenic" aria-pressed="true">
                <span class="v2-option-row">
                    <span class="v2-radio" aria-hidden="true"></span>
                    <span class="v2-line v2-line--passingby" aria-hidden="true"></span>
                    <span class="v2-option-name">PassingBy</span>
                    <span class="v2-option-times">
                        <span class="v2-option-time" id="time-scenic">–</span>
                        <span class="v2-option-diff" id="time-diff"></span>
                    </span>
                </span>
                <span class="v2-option-detail">
                    <span class="v2-eyebrow" id="landmark-count">Finding landmarks on your route…</span>
                    <span class="v2-landmark-list" id="landmark-list"></span>
                </span>
            </button>
        </div>

        <div class="v2-route-footer">
            <button class="btn btn-primary btn-large" id="continue-btn" onclick="proceedToNext()">Continue</button>
        </div>
    </div>

    <script>const GOOGLE_MAPS_KEY = "{{ google_maps_key }}";</script>
    <script src="/static/v2/js/route_selection.js?v=2"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_key }}&callback=initRouteMap" async defer></script>
</body>
</html>
