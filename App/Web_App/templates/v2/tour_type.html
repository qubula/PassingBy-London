<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Choose Theme - PassingBy</title>
    <link rel="stylesheet" href="/static/v2/css/style.css?v=7">
    <link rel="stylesheet" href="/static/v2/css/v2.css?v=6">
    <!-- Edition display fonts: only used for theme names. Everything else stays in Satoshi. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Big+Shoulders+Display:wght@700&family=Bodoni+Moda:wght@600&family=Cinzel:wght@700&family=Cormorant+Garamond:wght@700&family=Fraunces:wght@600&family=Grenze+Gotisch:wght@600&family=JetBrains+Mono:ital,wght@0,500;1,500&family=Unbounded:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- v2 Choose Theme. Figma: "05b · Theme identities v2 — one body, nine editions".
         Same tile body for every theme; only colours, glyph and name font change. -->
    <div class="screen v2-theme">
        <header class="v2-header">
            <button class="v2-back" onclick="history.back()" aria-label="Go back">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 19L8 12L15 5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <h1>Choose Theme</h1>
            <p class="v2-header-sub" id="theme-desc">Checking themes on your route…</p>
        </header>

        <div class="v2-tile-grid" id="tile-grid" aria-busy="true">
            <!-- Filled by tour_selection.js; placeholders while the route is checked -->
            <div class="v2-tile v2-tile--loading"></div><div class="v2-tile v2-tile--loading"></div>
            <div class="v2-tile v2-tile--loading"></div><div class="v2-tile v2-tile--loading"></div>
            <div class="v2-tile v2-tile--loading"></div><div class="v2-tile v2-tile--loading"></div>
        </div>
    </div>

    <script src="/static/v2/js/editions.js?v=1"></script>
    <script src="/static/v2/js/tour_selection.js?v=15"></script>
</body>
</html>
